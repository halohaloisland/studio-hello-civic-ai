<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Hello 市民会議 統合AIシステム（グラレコ・マインドマップ・タイマー＆テロップ・25名話者識別・自律調査）</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #1e293b;
      --panel-alt: #162032;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --accent: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 7px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 14px;
    }
    .nav-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: #0f172a;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .top-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    input, select, button {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #052e16; }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-purple { background: var(--purple); border-color: var(--purple); color: #fff; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #334155;
    }
    .badge.ok { background: #065f46; color: #6ee7b7; }
    .badge.warn { background: var(--warn); color: #000; font-weight: 700; }
    .badge.err { background: #991b1b; color: #fecaca; }

    .view-container { flex: 1; display: none; overflow: hidden; }
    .view-container.active { display: grid; }

    #viewLive { grid-template-columns: 310px 1fr 320px; }
    .col {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .col:last-child { border-right: none; }
    .col-header {
      background: var(--panel-alt);
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 25名パレット */
    .speaker-grid {
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      max-height: 220px;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
    }
    .spk-chip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 4px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spk-chip.remote { border-left: 3px solid #38bdf8; }
    .spk-chip.venue { border-left: 3px solid #a3e635; }
    .spk-chip.active {
      background: #1d4ed8;
      border-color: #60a5fa;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 0 2px rgba(96,165,250,0.4);
    }

    /* リアルタイム入力音量メーター */
    .meter-bar-wrap {
      background: #0f172a;
      padding: 4px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .meter-track {
      flex: 1;
      height: 6px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      transition: width 0.08s linear;
    }

    .scroll-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      user-select: text;
    }
    .log-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
    }
    .log-item.error-box {
      background: #450a0a;
      border-color: #ef4444;
      color: #fecaca;
      font-size: 11.5px;
    }
    .log-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .log-speaker {
      background: #1e40af;
      color: #dbeafe;
      padding: 1px 7px;
      border-radius: 4px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 中央ツールバー（モード切替＆電子ペン） */
    .canvas-toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 5px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }
    .mode-switch-group, .pen-group {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .mode-btn.active {
      background: var(--primary);
      border-color: #93c5fd;
      color: #fff;
    }
    .pen-btn.selected {
      outline: 2px solid #fff;
      font-weight: 800;
    }

    /* 会議進行ツールバー（タイマー＆テロップ制御バー） */
    .presenter-bar {
      background: #131c31;
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
    }
    .timer-controls, .telop-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .preset-chip {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      cursor: pointer;
    }
    .preset-chip.active {
      background: #f59e0b;
      color: #000;
      border-color: #fbbf24;
      font-weight: 700;
    }

    /* ボード本体 */
    .board-wrapper {
      flex: 1;
      position: relative;
      background: #f8fafc;
      color: #0f172a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #visualContentArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
    }
    #aiGraphicLayer {
      flex: 1;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #mindmapLayer {
      flex: 1;
      position: relative;
      background: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      background-color: #f1f5f9;
      overflow: hidden;
      display: none;
      border-top: 2px solid #cbd5e1;
    }
    #mindmapSvg {
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #mindmapSvg:active { cursor: grabbing; }
    .mm-overlay-bar {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .mm-overlay-bar > * { pointer-events: auto; }
    .mm-status-pill {
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gr-header-banner {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gr-header-banner h2 { margin: 0; font-size: 18px; }
    .gr-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .gr-card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .gr-card.opinion { border-top: 5px solid #3b82f6; }
    .gr-card.issue { border-top: 5px solid #f59e0b; }
    .gr-card.consensus { border-top: 5px solid #10b981; background: #f0fdf4; }
    .gr-card.fact { border-top: 5px solid #8b5cf6; background: #f5f3ff;
